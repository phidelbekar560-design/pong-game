<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="player-score">
                <h2>Player</h2>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="vs">VS</div>
            <div class="computer-score">
                <h2>Computer</h2>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong> Use Mouse Y-position or Arrow Keys (Up/Down) to move your paddle</p>
            <p><strong>Goal:</strong> Bounce the ball past the computer's paddle to score!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
